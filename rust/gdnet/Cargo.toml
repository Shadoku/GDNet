[package]
name = "gdnet"
description = "gdnet: multiplayer for Godot 4 that stays close to single-player development (GDExtension)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
netcore = { path = "../netcore" }
godot = { version = "0.5.5", features = ["api-4-3"] }

# Godot's web export is wasm32-unknown-emscripten (docs/PLAN_NETCODE.md 2.9, gate G3). gdext needs its
# experimental wasm features there; resolver 2 applies them only when building for a wasm target.
[target.'cfg(target_family = "wasm")'.dependencies]
godot = { version = "0.5.5", features = ["api-4-3", "experimental-wasm", "experimental-wasm-nothreads"] }
