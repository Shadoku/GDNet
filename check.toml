# check.toml: what `python3 tools/check.py` runs. Stages run in this order.
#
# Keys of a [[stage]]:
#   name          what the report calls it
#   run           the shell command (run from the project root); exit code 0 = pass
#   tier          "quick" (also part of --tier quick) or "full" (the default)
#   filter        the command for `--filter NAME`, with {filter} where the name goes;
#                 stages without it are left out of a filtered run
#   no_match_exit exit codes of `filter` that mean "no test matches" (not a failure,
#                 as long as another stage matched)
#   filter_match  for a runner that exits 0 when nothing matches: a regex its output
#                 matches only when a test ran
#   summary       a regex; the runner's line(s) it matches are shown under a pass
#                 (the last four)
#   parallel      true: runs side by side with the parallel stages next to it
#   stop_on_fail  true: when it fails the later stages are skipped (a build, a compile)
#   files         glob(s) of test files; with {files} in `run` (and `filter`) the stage is
#                 split over several processes by file, for a runner that has no
#                 parallelism of its own. max_processes caps how many.
#   env           environment variables for the command
#   timeout       seconds (default 600); tail: lines of output shown on failure (60)
#   needs         executables the stage needs; if_missing = "skip" skips it without them
#                 (the default fails)
# {jobs} in a command is the number of parallel jobs.
#
# Quick stages are the inner loop: keep their total under [budget].quick seconds, or
# nobody will run them. Everything that needs a build, a browser, a database, a network
# or real time belongs in the full tier.
#
# --filter runs only the stages with a `filter` (rust-test, unit, integration): build and
# import do not run, so after adding a script, a class_name or a resource run --tier quick
# (or --only import) once before filtering.

# Measured on 4 CPUs (2026-11-13): quick 7 s, full 48 s (integration 40 s). A first Rust
# build exceeds both; that note is expected once.
[budget]
quick = 15
full = 75

[cache]
# The toolchain: Godot, cargo and rustc versions (tools/godot.py version prints all three).
tools = ["python3 tools/godot.py version"]
env = ["RUSTFLAGS"]

# --- quick tier: the inner loop ---------------------------------------------------------

[[stage]]
name = "build"
# cargo build --release -p gdnet, copied into addons/gdnet/bin/<platform>/ (Godot loads it from there).
run = "python3 tools/godot.py build"
tier = "quick"
stop_on_fail = true
timeout = 1800      # a first build compiles gdext: several minutes

[[stage]]
name = "import"
# godot --import: assets and the class_name cache; every later Godot stage needs it.
run = "python3 tools/godot.py import"
tier = "quick"
stop_on_fail = true

[[stage]]
name = "validate"
# Every .gd script compiles (parse and static type errors); Godot's error blocks on failure.
run = "python3 tools/godot.py validate"
summary = '^SCRIPTS:.*$'
tier = "quick"
parallel = true     # beside rust-test: Godot and cargo do not lock each other

[[stage]]
name = "rust-test"
# netcore's (and gdnet's) unit tests. Takes rust/target's lock: never parallel with another cargo stage.
run = "cd rust && cargo test --workspace --quiet"
filter = "cd rust && cargo test --workspace --quiet -- {filter}"
filter_match = '^running [1-9]\d* tests?$'
summary = '^test result: .*$'
tier = "quick"
parallel = true
needs = ["cargo"]
if_missing = "skip"

[[stage]]
name = "unit"
# tests/unit: plain classes, milliseconds each. The runner prints `TESTS: ... (N total)`.
run = "python3 tools/godot.py test --dir tests/unit --junit junit-unit.xml"
filter = "python3 tools/godot.py test --dir tests/unit --filter {filter}"
filter_match = '^TESTS: .*\([1-9]\d* total\)$'
summary = '^TESTS:.*$'
tier = "quick"

# --- full tier ------------------------------------------------------------------------

[[stage]]
name = "integration"
# tests/integration: scenes and NetFixture sessions, split over {jobs} Godot processes by the
# runner itself (whole files, balanced by user://test_durations.json). Measured on 4 CPUs:
# 2 processes 72 s, 3 48 s, 4 40 s (= the longest file, test_net_prediction.gd), so no cap.
run = "python3 tools/godot.py test --dir tests/integration --jobs {jobs} --junit junit-integration.xml"
filter = "python3 tools/godot.py test --dir tests/integration --jobs {jobs} --filter {filter}"
filter_match = '^TESTS: .*\([1-9]\d* total\)$'
summary = '^TESTS:.*$'
timeout = 600
parallel = true     # beside lint: cargo does not touch Godot's files

[[stage]]
name = "lint"
# rustfmt and clippy, warnings as errors (CLAUDE.md, Conventions). Cargo: not beside another cargo stage.
run = "cd rust && cargo fmt --check && cargo clippy --workspace --all-targets --quiet -- -D warnings"
parallel = true
needs = ["cargo-clippy"]
if_missing = "skip"

[[stage]]
name = "smoke"
# The main scene runs 30 frames headless; any error printed fails it (Godot itself exits 0).
run = "python3 tools/godot.py smoke"
# Not parallel: consecutive parallel stages form one group, and smoke must not run beside the
# integration stage's Godot processes, nor wasm beside lint (rust/target's lock).

[[stage]]
name = "wasm"
# Gate G3 (docs/PLAN_NETCODE.md): the workspace builds for wasm32-unknown-emscripten. Passes with a
# "skipped" line where the target is not installed; CI installs it.
run = "python3 tools/godot.py wasm"
needs = ["rustup"]
if_missing = "skip"
