name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Install Godot
        run: bash tools/install_godot.sh

      # Every stage of check.toml (import, validate, unit, integration, smoke): CI runs the full tier.
      - name: Run checks
        run: python3 tools/check.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit-*.xml
          if-no-files-found: ignore
