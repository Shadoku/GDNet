name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ runner.os }}-${{ hashFiles('.godot-version') }}

      - name: Install Godot
        run: bash tools/install_godot.sh

      # The Emscripten target lets check.toml's wasm stage (gate G3, docs/PLAN_NETCODE.md) run for
      # real here: the sans-IO core and the extension must keep compiling for Godot's web export.
      - name: Install Rust (stable, with clippy, rustfmt and the Emscripten target)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: wasm32-unknown-emscripten

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Every stage of check.toml: build gdnet, import, validate, rust tests, unit and integration
      # tests, lint, smoke, wasm. CI always runs the full tier.
      - name: Run checks
        run: python3 tools/check.py

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit-*.xml
          if-no-files-found: ignore
